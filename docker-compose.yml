services:
  postgres:
    image: postgres:18
    container_name: travelplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelplanner
      POSTGRES_PASSWORD: travelplanner
      POSTGRES_DB: travelplanner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: